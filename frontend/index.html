  <div class="app-shell">

        <span class="brand-copy">
          <strong>ReviewLens</strong>
          <span>商品评论问题雷达</span>

      <nav class="main-nav" aria-label="主导航">

          <span class="nav-icon" aria-hidden="true">

        </a>
        <a class="nav-link" href="#/reviews" data-route="reviews">
          <span class="nav-icon" aria-hidden="true">

      <div class="sidebar-meta">
        <span class="meta-label">DEMO ENVIRONMENT</span>
        <p>所有数据均为前端 mock，不写入后端。</p>
        <a href="#/about">查看 API 与文档 <span aria-hidden="true">→</span></a>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow" id="page-kicker">INGESTION</p>
          <h1 id="page-title">批次上传</h1>
          <p id="page-subtitle">从 CSV 接入评论，校验后建立分析任务。</p>
        </div>
        <div class="topbar-actions">
          <span class="mock-chip"><span class="mock-chip-dot" aria-hidden="true"></span>本地 Mock</span>
          <a class="topbar-link" href="#/about">接口说明 <span aria-hidden="true">↗</span></a>
        </div>
      </header>

      <main class="content" id="app" tabindex="-1">
        <noscript>
          <div class="noscript-card">此演示界面需要启用 JavaScript 才能切换页面。</div>
        </noscript>

      <footer class="app-footer">
        <span>MAIE6000c · 商品评论管理与重复问题发现系统</span>

  <script src="./mock-data.js"></script>
